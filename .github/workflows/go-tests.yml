name: Go Runtime tests

on:
  pull_request:
  push:
    branches: ['feature/**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
      - name: Verify committed Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run tests with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          gofmt -d cmd internal
          gofmt -l cmd internal
          test -z "$(gofmt -l cmd internal)"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agent_runtime_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agent_runtime_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.0'
      - name: Verify committed Go module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Run PostgreSQL integration tests
        run: go test -race -count=1 ./internal/store/postgres/...
