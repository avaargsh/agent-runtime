name: runtime-recovery-contract

on:
  pull_request:
    paths:
      - "go.mod"
      - "internal/recovery/**"
      - ".github/workflows/runtime-recovery-contract.yml"
  push:
    branches: [main, feature/platform-foundation]
    paths:
      - "go.mod"
      - "internal/recovery/**"
      - ".github/workflows/runtime-recovery-contract.yml"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # go.mod declares language minimum, not the patched CI binary.
          go-version: '1.26.10'
      - name: Assert patched Go toolchain
        run: |
          test "$(go env GOVERSION)" = "go1.26.10"
          go version
      - name: Test Runtime recovery policy
        run: go test ./...
